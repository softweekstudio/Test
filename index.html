<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Direct MP4 Audio Extraction Test</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f5f5;color:#222}
.wrap{max-width:680px;margin:24px auto;padding:18px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 16px;font-size:28px}.row,.info{padding:12px;border-radius:12px;background:#f0f0f0;margin:10px 0;line-height:1.45;word-break:break-word}
button{width:100%;padding:15px;margin-top:12px;border:0;border-radius:12px;font-size:16px;cursor:pointer}
#choose{background:#222;color:#fff}#extract{background:#111;color:#fff}#clear{background:#eee}
button:disabled{opacity:.45;cursor:not-allowed}
#status{margin-top:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.small{font-size:14px;color:#555}
.ok{font-weight:700}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>Direct MP4 Audio Test</h1>
<div class="row" id="engine">MP4Box.js: loading...</div>
<div class="row" id="fileInfo">No video selected.</div>
<div class="row" id="timing">Test timing: not started</div>
<input id="fileInput" type="file" accept="video/mp4,.mp4" hidden>
<button id="choose">📁 Choose MP4 Video</button>
<button id="extract" disabled>🎵 Extract Audio Directly</button>
<button id="clear">Clear</button>
<div id="status">Ready.</div>
<div class="small">Diagnostic test only. This bypasses FFmpeg and reads the MP4 container directly with MP4Box.js. For AAC audio it creates an .aac test file without re-encoding.</div>
</div></div>

<script type="module">
import * as MP4Box from "https://cdn.jsdelivr.net/npm/mp4box@2.4.1/dist/mp4box.all.js";

const $=id=>document.getElementById(id);
const input=$("fileInput"), choose=$("choose"), extract=$("extract"), clearBtn=$("clear");
const status=$("status"), fileInfo=$("fileInfo"), timing=$("timing"), engine=$("engine");
let selectedFile=null, busy=false;

engine.textContent="✅ MP4Box.js: READY";

function setStatus(t){status.textContent=t}
function downloadBlob(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),3000);
}
function rateLabel(bytes,sec){
  if(!sec) return "—";
  return ((bytes/1024/1024)/sec).toFixed(1)+" MB/s";
}
function adtsHeader(frameLength, sampleRate, channels, profile=2){
  const rates=[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350];
  const sr=rates.indexOf(sampleRate);
  if(sr<0) throw new Error("Unsupported AAC sample rate: "+sampleRate);
  let ch=channels;
  if(ch<1||ch>6) throw new Error("Unsupported AAC channel count: "+ch);
  const h=new Uint8Array(7);
  const fullLen=frameLength+7;
  h[0]=0xFF; h[1]=0xF1;
  h[2]=((profile-1)<<6)|(sr<<2)|((ch>>2)&1);
  h[3]=((ch&3)<<6)|((fullLen>>11)&3);
  h[4]=(fullLen>>3)&0xFF;
  h[5]=((fullLen&7)<<5)|0x1F;
  h[6]=0xFC;
  return h;
}

async function directExtract(file){
  const t0=performance.now();
  const mp4boxfile=MP4Box.createFile();
  const chunkSize=4*1024*1024;
  let offset=0, audioTrack=null, samples=[], sampleBytes=0, readyResolve, readyReject, readyDone=false;
  const readyPromise=new Promise((res,rej)=>{readyResolve=res;readyReject=rej});

  mp4boxfile.onError=e=>readyReject(new Error(String(e)));
  mp4boxfile.onReady=info=>{
    audioTrack=info.tracks.find(t=>t.type==="audio" || t.audio);
    if(!audioTrack){readyReject(new Error("No audio track found in this MP4."));return;}
    mp4boxfile.onSamples=(id,user,batch)=>{
      for(const s of batch){
        if(s&&s.data){
          const u8=new Uint8Array(s.data);
          samples.push(u8);
          sampleBytes+=u8.byteLength;
        }
      }
    };
    mp4boxfile.setExtractionOptions(audioTrack.id,null,{nbSamples:200});
    mp4boxfile.start();
    readyDone=true;
    readyResolve();
  };

  setStatus("Reading MP4 container...");
  // Feed until onReady fires.
  while(offset<file.size && !readyDone){
    const end=Math.min(offset+chunkSize,file.size);
    const buf=await file.slice(offset,end).arrayBuffer();
    buf.fileStart=offset;
    mp4boxfile.appendBuffer(buf);
    offset=end;
    setStatus("Reading MP4 container... "+Math.round(offset/file.size*100)+"%");
    await new Promise(r=>setTimeout(r,0));
  }
  await readyPromise;

  // Continue feeding the rest of the file with extraction active.
  while(offset<file.size){
    const end=Math.min(offset+chunkSize,file.size);
    const buf=await file.slice(offset,end).arrayBuffer();
    buf.fileStart=offset;
    mp4boxfile.appendBuffer(buf);
    offset=end;
    const elapsed=(performance.now()-t0)/1000;
    setStatus("Extracting audio directly... "+Math.round(offset/file.size*100)+"%\nAudio samples collected: "+(sampleBytes/1024/1024).toFixed(1)+" MB\nRead speed: "+rateLabel(offset,elapsed));
    await new Promise(r=>setTimeout(r,0));
  }
  mp4boxfile.flush();

  // Give final onSamples callbacks a chance to run.
  await new Promise(r=>setTimeout(r,50));

  if(!audioTrack) throw new Error("No audio track found.");
  const codec=String(audioTrack.codec||"").toLowerCase();
  const elapsed=(performance.now()-t0)/1000;

  if(!codec.startsWith("mp4a")){
    throw new Error("Direct test currently supports AAC in MP4. Detected codec: "+(audioTrack.codec||"unknown"));
  }

  const sampleRate=(audioTrack.audio&&audioTrack.audio.sample_rate)||44100;
  const channels=(audioTrack.audio&&audioTrack.audio.channel_count)||2;
  const chunks=[];
  for(const s of samples){
    const h=adtsHeader(s.byteLength,sampleRate,channels,2);
    chunks.push(h,s);
  }
  const blob=new Blob(chunks,{type:"audio/aac"});
  const base=file.name.replace(/\.[^/.]+$/,"")||"audio";
  downloadBlob(blob,base+"-direct-audio.aac");
  timing.textContent="Extraction time: "+elapsed.toFixed(1)+" s\nInput processed: "+(file.size/1024/1024).toFixed(1)+" MB\nAudio samples: "+(sampleBytes/1024/1024).toFixed(1)+" MB\nRead speed: "+rateLabel(file.size,elapsed);
  setStatus("✅ Direct extraction finished\nCodec: "+codec+"\nNo FFmpeg\nNo audio re-encoding\nTest .aac file downloaded.");
}

choose.addEventListener("click",()=>input.click());
input.addEventListener("change",()=>{
  selectedFile=input.files&&input.files[0]||null;
  if(selectedFile){
    fileInfo.textContent=selectedFile.name+" — "+(selectedFile.size/1024/1024).toFixed(1)+" MB";
    extract.disabled=false;
    setStatus("Ready. Press Extract Audio Directly.");
  }else extract.disabled=true;
});
extract.addEventListener("click",async()=>{
  if(!selectedFile||busy)return;
  busy=true; extract.disabled=true; choose.disabled=true; clearBtn.disabled=true;
  timing.textContent="Test timing: running...";
  try{await directExtract(selectedFile)}
  catch(e){setStatus("ERROR: "+(e&&e.message?e.message:e))}
  finally{busy=false;extract.disabled=!selectedFile;choose.disabled=false;clearBtn.disabled=false}
});
clearBtn.addEventListener("click",()=>{
  selectedFile=null; input.value=""; fileInfo.textContent="No video selected."; extract.disabled=true;
  timing.textContent="Test timing: not started"; setStatus("Ready.");
});
</script>
</body>
</html>
