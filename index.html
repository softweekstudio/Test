<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FFmpeg Diagnostic Multi-Thread</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;background:#f5f5f5;color:#222}
.wrap{max-width:640px;margin:30px auto;padding:20px}.card{background:#fff;border-radius:20px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{margin:0 0 14px;font-size:28px}.row{padding:12px;border-radius:12px;background:#f0f0f0;margin:10px 0;line-height:1.45}.ok{font-weight:700}.info{padding:12px;border-radius:12px;background:#f0f0f0;margin:14px 0;word-break:break-word}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:12px;font-size:16px;cursor:pointer}#choose{background:#222;color:#fff}#load{background:#333;color:#fff}#extract{background:#111;color:#fff}#clear{background:#eee}button:disabled{opacity:.45;cursor:not-allowed}
#status{margin-top:18px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.small{font-size:14px;color:#555}
</style></head>
<body><div class="wrap"><div class="card">
<h1>FFmpeg Diagnostic Test</h1>
<div class="row" id="isolation">Checking browser isolation...</div>
<div class="row" id="engine">FFmpeg engine: not loaded</div>
<div class="row" id="timing">Load timing: not started</div>
<div class="info" id="fileInfo">No video selected.</div>
<input id="fileInput" type="file" accept="video/*" hidden>
<button id="load">⚡ Load FFmpeg</button>
<button id="choose">📁 Choose Video</button>
<button id="extract" disabled>Extract Original Audio</button>
<button id="clear">Clear</button>
<div id="status">Ready.</div>
<div class="small">This page is only a diagnostic. It measures FFmpeg loading separately from audio extraction.</div>
</div></div>
<script>
const FFMPEG_VERSION="0.12.15", CORE_VERSION="0.12.10", CORE_PACKAGE="@ffmpeg/core-mt";
const $=id=>document.getElementById(id);
const loadBtn=$("load"),choose=$("choose"),input=$("fileInput"),extract=$("extract"),clearBtn=$("clear"),status=$("status"),fileInfo=$("fileInfo"),isolation=$("isolation"),engine=$("engine"),timing=$("timing");
let selectedFile=null, ffmpegInstance=null, loading=null;
function setStatus(t){status.textContent=t}
function downloadAudio(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function updateIsolation(){const on=window.crossOriginIsolated===true&&typeof SharedArrayBuffer!=="undefined";isolation.textContent=on?"⚡ Cross-origin isolation: ON — SharedArrayBuffer available":"⚠️ Cross-origin isolation: OFF";return on}
updateIsolation();
try{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{})}catch(e){}
async function blobUrlFromUrl(url,mime){const t0=performance.now();const r=await fetch(url,{cache:"force-cache"});if(!r.ok)throw new Error("Cannot load "+url+" (HTTP "+r.status+")");const b=await r.blob();return {url:URL.createObjectURL(new Blob([b],{type:mime})),seconds:(performance.now()-t0)/1000,bytes:b.size}}
async function createWorker(){const t0=performance.now();const url="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@"+FFMPEG_VERSION+"/dist/esm/worker.js";const r=await fetch(url,{cache:"force-cache"});if(!r.ok)throw new Error("Cannot load FFmpeg worker (HTTP "+r.status+")");let s=await r.text();const c=`const MIME_TYPE_JAVASCRIPT="text/javascript";const MIME_TYPE_WASM="application/wasm";const CORE_VERSION="${CORE_VERSION}";const CORE_PACKAGE="${CORE_PACKAGE}";const CORE_URL=\`https://cdn.jsdelivr.net/npm/\${CORE_PACKAGE}@\${CORE_VERSION}/dist/umd/ffmpeg-core.js\`;const FFMessageType={LOAD:"LOAD",EXEC:"EXEC",FFPROBE:"FFPROBE",WRITE_FILE:"WRITE_FILE",READ_FILE:"READ_FILE",DELETE_FILE:"DELETE_FILE",RENAME:"RENAME",CREATE_DIR:"CREATE_DIR",LIST_DIR:"LIST_DIR",DELETE_DIR:"DELETE_DIR",ERROR:"ERROR",DOWNLOAD:"DOWNLOAD",PROGRESS:"PROGRESS",LOG:"LOG",MOUNT:"MOUNT",UNMOUNT:"UNMOUNT"};`;
const e=`const ERROR_UNKNOWN_MESSAGE_TYPE=new Error("unknown message type");const ERROR_NOT_LOADED=new Error("ffmpeg is not loaded, call \\`await ffmpeg.load()\\` first");const ERROR_TERMINATED=new Error("called FFmpeg.terminate()");const ERROR_IMPORT_FAILURE=new Error("failed to import ffmpeg-core.js");`;
s=s.replace(/import\s*\{\s*CORE_URL\s*,\s*FFMessageType\s*\}\s*from\s*["']\.\/const\.js["']\s*;?/g,c).replace(/import\s*\{\s*ERROR_UNKNOWN_MESSAGE_TYPE\s*,\s*ERROR_NOT_LOADED\s*,\s*ERROR_IMPORT_FAILURE\s*,?\s*\}\s*from\s*["']\.\/errors\.js["']\s*;?/g,e);if(/from ["']\.\/const\.js["']|from ["']\.\/errors\.js["']/.test(s))throw new Error("Could not embed FFmpeg worker dependencies");return {url:URL.createObjectURL(new Blob([s],{type:"text/javascript"})),seconds:(performance.now()-t0)/1000}}
function bridge(worker,core,wasm,pthread){let id=1,pending=new Map(),logs=[];worker.onmessage=ev=>{const m=ev.data||{};if(m.type==="LOG"){const line=m.data&&m.data.message?String(m.data.message):"";if(line){logs.push(line);if(logs.length>40)logs.shift()}return}if(m.type==="PROGRESS")return;const p=pending.get(m.id);if(!p)return;pending.delete(m.id);m.type==="ERROR"?p.reject(new Error(String(m.data||"FFmpeg worker error"))):p.resolve(m.data)};worker.onerror=ev=>{const msg=ev&&ev.message?ev.message:"FFmpeg worker error";pending.forEach(p=>p.reject(new Error(msg)));pending.clear()};function send(type,data){const i=id++;return new Promise((resolve,reject)=>{pending.set(i,{resolve,reject});try{worker.postMessage({id:i,type,data})}catch(e){pending.delete(i);reject(e)}})}return{load:()=>send("LOAD",{coreURL:core,wasmURL:wasm,workerURL:pthread}),createDir:p=>send("CREATE_DIR",{path:p}),mount:(f,o,p)=>send("MOUNT",{fsType:f,options:o,mountPoint:p}),unmount:p=>send("UNMOUNT",{mountPoint:p}),exec:a=>send("EXEC",{args:a,timeout:-1}),ffprobe:a=>send("FFPROBE",{args:a}),readFile:p=>send("READ_FILE",{path:p,encoding:"binary"}),deleteFile:p=>send("DELETE_FILE",{path:p}),listDir:p=>send("LIST_DIR",{path:p}),logs:()=>logs.slice()}}
async function loadFFmpeg(){if(ffmpegInstance)return ffmpegInstance;if(loading)return loading;if(!updateIsolation())throw new Error("Multi-thread is not available on this page. Open the GitHub Pages URL and reload it.");loading=(async()=>{const total=performance.now();timing.textContent="Load timing: starting...";setStatus("1/4 Loading FFmpeg worker...");const w=await createWorker();timing.textContent="Load timing: worker downloaded in "+w.seconds.toFixed(1)+" s";setStatus("2/4 Loading FFmpeg core + WASM + pthread worker...");const base="https://cdn.jsdelivr.net/npm/"+CORE_PACKAGE+"@"+CORE_VERSION+"/dist/umd";const [core,wasm,pthread]=await Promise.all([blobUrlFromUrl(base+"/ffmpeg-core.js","text/javascript"),blobUrlFromUrl(base+"/ffmpeg-core.wasm","application/wasm"),blobUrlFromUrl(base+"/ffmpeg-core.worker.js","text/javascript")]);timing.textContent="Load timing: core.js "+core.seconds.toFixed(1)+" s; WASM "+wasm.seconds.toFixed(1)+" s; pthread worker "+pthread.seconds.toFixed(1)+" s";setStatus("3/4 Starting FFmpeg multi-thread engine...");const worker=new Worker(w.url);const b=bridge(worker,core.url,wasm.url,pthread.url);const start=performance.now();await Promise.race([b.load(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("FFmpeg engine startup timeout (90 s).")),90000))]);const startup=(performance.now()-start)/1000;const totalSec=(performance.now()-total)/1000;ffmpegInstance=b;engine.textContent="✅ FFmpeg engine: READY";timing.textContent+="\nEngine startup: "+startup.toFixed(1)+" s\nTOTAL FFmpeg load: "+totalSec.toFixed(1)+" s";setStatus("4/4 FFmpeg ready ✓\nNow choose a video and extract audio.");return b})().catch(e=>{loading=null;engine.textContent="❌ FFmpeg engine: ERROR";throw e});return loading}
async function extractOriginal(file){const f=await loadFFmpeg();const t0=performance.now();let out="";try{setStatus("Preparing input...");await f.createDir("/input").catch(()=>{});await f.mount("WORKERFS",{files:[file]},"/input");const nodes=await f.listDir("/input");const n=nodes.find(x=>x&&!x.isDir&&x.name!=="."&&x.name!=="..");if(!n)throw new Error("FFmpeg cannot see the selected video.");const inPath="/input/"+n.name;setStatus("Detecting audio codec...");const probe=await f.ffprobe(["-v","error","-select_streams","a:0","-show_entries","stream=codec_name","-of","default=noprint_wrappers=1:nokey=1",inPath]);const codec=String(probe||"").trim().split(/\s+/)[0].toLowerCase();if(!codec)throw new Error("Could not detect audio codec.");const map={mp3:{ext:"mp3",mux:"mp3",mime:"audio/mpeg"},aac:{ext:"m4a",mux:"ipod",mime:"audio/mp4"},alac:{ext:"m4a",mux:"ipod",mime:"audio/mp4"},ac3:{ext:"ac3",mux:"ac3",mime:"audio/ac3"},eac3:{ext:"eac3",mux:"eac3",mime:"audio/eac3"},flac:{ext:"flac",mux:"flac",mime:"audio/flac"},opus:{ext:"opus",mux:"ogg",mime:"audio/ogg"},vorbis:{ext:"ogg",mux:"ogg",mime:"audio/ogg"},pcm_s16le:{ext:"wav",mux:"wav",mime:"audio/wav"},pcm_s24le:{ext:"wav",mux:"wav",mime:"audio/wav"},pcm_s32le:{ext:"wav",mux:"wav",mime:"audio/wav"},pcm_f32le:{ext:"wav",mux:"wav",mime:"audio/wav"}};const target=map[codec]||{ext:"mka",mux:"matroska",mime:"audio/x-matroska"};out="/original-audio."+target.ext;setStatus("Extracting original audio ("+codec.toUpperCase()+")...");const exit=await f.exec(["-nostdin","-y","-i",inPath,"-map","0:a:0","-vn","-sn","-dn","-c:a","copy","-map_metadata","0","-f",target.mux,out]);if(exit!==0)throw new Error("FFmpeg extraction failed. "+f.logs().slice(-8).join(" | "));const data=await f.readFile(out);if(!data||!data.length)throw new Error("FFmpeg created an empty file.");const base=file.name.replace(/\.[^/.]+$/,'')||"extracted-audio";downloadAudio(new Blob([data],{type:target.mime}),base+"-original-audio."+target.ext);setStatus("Extraction finished ✓\nExtraction time: "+((performance.now()-t0)/1000).toFixed(1)+" s\nCodec: "+codec.toUpperCase()+"\nNo re-encoding.")}finally{if(out)try{await f.deleteFile(out)}catch(e){}try{await f.unmount("/input")}catch(e){}}}
loadBtn.addEventListener('click',async()=>{loadBtn.disabled=true;try{await loadFFmpeg()}catch(e){setStatus("ERROR: "+(e&&e.message?e.message:e));loadBtn.disabled=false}});
choose.addEventListener('click',()=>input.click());input.addEventListener('change',()=>{selectedFile=input.files&&input.files[0]||null;if(selectedFile){fileInfo.textContent=selectedFile.name+" — "+(selectedFile.size/1024/1024).toFixed(1)+" MB";extract.disabled=!ffmpegInstance;setStatus(ffmpegInstance?"Ready to extract.":"FFmpeg must finish loading first.")}else{extract.disabled=true}});
extract.addEventListener('click',async()=>{if(!selectedFile)return;extract.disabled=true;try{await extractOriginal(selectedFile)}catch(e){setStatus("ERROR: "+(e&&e.message?e.message:e))}finally{extract.disabled=false}});
clearBtn.addEventListener('click',()=>{selectedFile=null;input.value='';fileInfo.textContent='No video selected.';extract.disabled=true;setStatus('Ready.')});
</script></body></html>
